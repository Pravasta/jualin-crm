<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[<helmet>
<meta name="design_doc_mode" content="page">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#fffdfb; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#1f1915; -webkit-font-smoothing:antialiased; }
  a { color:#a72b00; text-decoration:underline; text-underline-offset:2px; }
  a:hover { color:#7e2000; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;background:#fffdfb">
  <sc-if value="{{ showSidebar }}" hint-placeholder-val="{{ true }}">
    <div style="width:{{ sidebarWidth }};flex-shrink:0;border-right:1px solid #e2ddd9;background:#fff;display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh">
      <div style="display:flex;align-items:center;gap:10px;padding:0 16px 18px;border-bottom:1px solid #f0ebe7;margin-bottom:8px">
        <div style="width:26px;height:26px;border-radius:7px;background:#ca3c00;flex-shrink:0"></div>
        <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ true }}"><span style="font-size:14px;font-weight:800;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden">Jualin CRM</span></sc-if>
      </div>
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="9">
        <a href="{{ item.href }}" style="display:flex;align-items:center;gap:12px;padding:10px 16px;margin:1px 8px;border-radius:8px;cursor:pointer;color:{{ item.color }};background:{{ item.bg }};font-size:14px;font-weight:600;text-decoration:none" title="{{ item.label }}">
          <span style="width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ item.icon }}"></span>
          <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap;overflow:hidden;flex:1">{{ item.label }}</span></sc-if>
        </a>
      </sc-for>
      <div style="margin-top:auto;padding:12px 16px 0;border-top:1px solid #f0ebe7">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:30px;height:30px;border-radius:999px;background:#f5ede7;color:#a72b00;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">BS</div>
          <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ true }}">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Budi Santoso</div>
              <div style="font-size:11.5px;color:#6a635e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Toko Maju Jaya · Owner</div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:{{ bottomPad }}">
    <sc-if value="{{ showMobileHeader }}" hint-placeholder-val="{{ false }}">
      <div style="position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e2ddd9;padding:12px 16px;display:flex;align-items:center;gap:10px">
        <div style="width:24px;height:24px;border-radius:6px;background:#ca3c00"></div>
        <span style="font-size:15px;font-weight:800;flex:1">Connect</span>
      </div>
    </sc-if>

    <div style="box-sizing:border-box;max-width:1100px;width:100%;margin:0 auto;padding:{{ contentPad }};flex:1;display:flex;flex-direction:column;gap:{{ sectionGap }}">

      <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
        <div>
          <h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-0.015em">Connect</h1>
          <p style="margin:4px 0 0;font-size:13.5px;color:#6a635e">Hubungkan sumber lead dan alat lain ke Jualin CRM.</p>
        </div>
      </sc-if>

      <div style="display:grid;grid-template-columns:{{ gridCols }};gap:14px">
        <sc-for list="{{ integrations }}" as="i" hint-placeholder-count="6">
          <div style="border:1px solid {{ i.cardBorder }};border-radius:12px;background:{{ i.cardBg }};padding:18px;display:flex;flex-direction:column;position:relative">
            <sc-if value="{{ i.locked }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#a05d00;background:#fff1e0;padding:3px 8px;border-radius:999px">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>
                {{ i.planNeeded }}
              </span>
            </sc-if>
            <div style="width:38px;height:38px;border-radius:10px;background:{{ i.iconBg }};color:{{ i.iconFg }};display:flex;align-items:center;justify-content:center;margin-bottom:12px" dangerouslySetInnerHTML="{{ i.icon }}"></div>
            <div style="font-size:15px;font-weight:700">{{ i.name }}</div>
            <p style="margin:6px 0 14px;font-size:13px;line-height:1.5;color:#6a635e;flex:1">{{ i.desc }}</p>

            <sc-if value="{{ i.locked }}" hint-placeholder-val="{{ false }}">
              <a href="Langganan.dc.html" style="text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:8px;background:#f7f3ef;color:#a05d00;text-decoration:none">Upgrade untuk membuka</a>
            </sc-if>
            <sc-if value="{{ !i.locked }}" hint-placeholder-val="{{ true }}">
              <sc-if value="{{ i.connected }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                  <span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#006307">
                    <span style="width:7px;height:7px;border-radius:999px;background:#1d802b"></span>Terhubung
                  </span>
                  <button type="button" onClick="{{ disconnect }}" data-key="{{ i.key }}" style="cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid #c9c3be;background:#fff;color:#4a443f">Putuskan</button>
                </div>
              </sc-if>
              <sc-if value="{{ !i.connected }}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{ connect }}" data-key="{{ i.key }}" style="cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:9px;border-radius:8px;border:none;background:#ca3c00;color:#fff">Hubungkan</button>
              </sc-if>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2ddd9;display:grid;grid-template-columns:repeat(5,1fr);z-index:36">
      <sc-for list="{{ bottomNavItems }}" as="b" hint-placeholder-count="5">
        <a href="{{ b.href }}" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;color:{{ b.color }};font-size:11px;font-weight:600;text-decoration:none">
          <span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ b.icon }}"></span>
          {{ b.label }}
        </a>
      </sc-for>
    </div>
  </sc-if>
</div>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1915;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(31,25,21,.24);z-index:60">{{ toast }}</div>
</sc-if>
]]>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const NAV_ICONS = {
  home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>',
  lead: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  customer: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>',
  task: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  report: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  team: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M15.5 15c2.5.3 4.5 2 4.5 5"/></svg>',
  connect: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4M6 8h12l-1 6a5 5 0 01-10 0z"/><path d="M12 17v4"/></svg>',
  sub: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  settings: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5v.2a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H4a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V4a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1H20a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>'
};
const ICONS = {
  wa: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1112 20a8.4 8.4 0 01-4-1z"></path></svg>',
  form: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9l3 3v13H6z"></path><path d="M9 10h6M9 14h6"></path></svg>',
  api: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4M6 8h12l-1 6a5 5 0 01-10 0z"></path><path d="M12 17v4"></path></svg>',
  ig: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17" cy="7" r="0.8" fill="currentColor"></circle></svg>',
  market: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"></path><path d="M3 9h18v11H3z"></path><path d="M9 13a3 3 0 006 0"></path></svg>',
  sheets: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 9h16M4 15h16M10 9v12"></path></svg>'
};
const INTEGRATIONS = [
  { key: 'wa', name: 'WhatsApp Business', desc: 'Terima lead langsung dari percakapan WhatsApp Business API.', icon: ICONS.wa, iconBg: '#effbef', iconFg: '#006307', connected: true, plan: 'starter' },
  { key: 'form', name: 'Formulir situs', desc: 'Sematkan formulir Jualin di situs Anda sendiri.', icon: ICONS.form, iconBg: '#fdf1ea', iconFg: '#a72b00', connected: true, plan: 'starter' },
  { key: 'api', name: 'API & Webhook', desc: 'Kirim dan tarik data lead lewat REST API.', icon: ICONS.api, iconBg: '#e4f8f8', iconFg: '#007b7d', connected: false, plan: 'tim' },
  { key: 'ig', name: 'Instagram DM', desc: 'Ubah pesan langsung Instagram jadi lead otomatis.', icon: ICONS.ig, iconBg: '#f6f0ff', iconFg: '#8156c0', connected: false, plan: 'tim' },
  { key: 'market', name: 'Marketplace', desc: 'Tarik pesanan dari Tokopedia dan Shopee sebagai lead.', icon: ICONS.market, iconBg: '#fff1e0', iconFg: '#a05d00', connected: false, plan: 'bisnis' },
  { key: 'sheets', name: 'Google Sheets', desc: 'Sinkronkan lead dua arah dengan spreadsheet.', icon: ICONS.sheets, iconBg: '#f7f3ef', iconFg: '#6a635e', connected: false, plan: 'bisnis' }
];
const PLAN_RANK = { starter: 0, tim: 1, bisnis: 2 };
const PLAN_LABEL = { tim: 'Butuh paket Tim', bisnis: 'Butuh paket Bisnis' };

class Component extends DCLogic {
  state = { vw: 1440, currentPlan: 'tim', overrides: {}, toast: '' };
  componentDidMount() {
    this._onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    this.setState({ vw: window.innerWidth });
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }
  connect = (e) => { const k = e.currentTarget.dataset.key; this.setState(s => ({ overrides: { ...s.overrides, [k]: true }, toast: `${INTEGRATIONS.find(i => i.key === k).name} terhubung.` })); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2200); };
  disconnect = (e) => { const k = e.currentTarget.dataset.key; this.setState(s => ({ overrides: { ...s.overrides, [k]: false }, toast: `${INTEGRATIONS.find(i => i.key === k).name} diputus.` })); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2200); };

  renderVals() {
    const vw = this.state.vw;
    const isMobile = vw < 768;
    const isTablet = vw >= 768 && vw < 1024;
    const myRank = PLAN_RANK[this.state.currentPlan];

    const integrations = INTEGRATIONS.map(i => {
      const locked = PLAN_RANK[i.plan] > myRank;
      const connected = i.key in this.state.overrides ? this.state.overrides[i.key] : i.connected;
      return {
        ...i, icon: { __html: i.icon }, locked, connected, planNeeded: PLAN_LABEL[i.plan],
        cardBorder: locked ? '#e2ddd9' : (connected ? '#bfe3bf' : '#e2ddd9'),
        cardBg: locked ? '#fbf9f7' : '#fff'
      };
    });

    const navMeta = [
      ['home', 'Beranda', 'Beranda.dc.html'], ['lead', 'Lead', 'Daftar Lead.dc.html'], ['customer', 'Customer', 'Daftar Customer.dc.html'], ['task', 'Tugas', 'Tugas.dc.html'],
      ['report', 'Laporan', 'Laporan.dc.html'], ['team', 'Tim', 'Tim.dc.html'], ['connect', 'Connect', 'Connect.dc.html'], ['sub', 'Langganan', 'Langganan.dc.html'], ['settings', 'Pengaturan', 'Pengaturan.dc.html']
    ];
    const navItems = navMeta.map(([icon, label, href]) => ({
      icon: { __html: NAV_ICONS[icon] }, label, href, color: label === 'Connect' ? '#a72b00' : '#1f1915', bg: label === 'Connect' ? '#fff1e0' : 'transparent'
    }));
    const bottomNavItems = [
      { icon: { __html: NAV_ICONS.home }, label: 'Beranda', color: '#6a635e', href: 'Beranda.dc.html' },
      { icon: { __html: NAV_ICONS.lead }, label: 'Lead', color: '#6a635e', href: 'Daftar Lead.dc.html' },
      { icon: { __html: NAV_ICONS.task }, label: 'Tugas', color: '#6a635e', href: 'Tugas.dc.html' },
      { icon: { __html: NAV_ICONS.report }, label: 'Laporan', color: '#6a635e', href: 'Laporan.dc.html' },
      { icon: { __html: NAV_ICONS.connect }, label: 'Connect', color: '#a72b00', href: 'Connect.dc.html' }
    ];

    return {
      isMobile, isTablet,
      showSidebar: !isMobile, sidebarExpanded: !isMobile && !isTablet, sidebarWidth: (!isMobile && !isTablet) ? '232px' : '68px',
      showMobileHeader: isMobile, bottomPad: isMobile ? '76px' : '0',
      contentPad: isMobile ? '14px' : isTablet ? '20px' : '28px', sectionGap: isMobile ? '14px' : '18px',
      gridCols: isMobile ? '1fr' : isTablet ? 'repeat(2,minmax(0,1fr))' : 'repeat(3,minmax(0,1fr))',
      navItems, bottomNavItems, integrations, connect: this.connect, disconnect: this.disconnect, toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
