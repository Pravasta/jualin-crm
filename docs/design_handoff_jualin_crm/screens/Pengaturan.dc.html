<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[<helmet>
<meta name="design_doc_mode" content="page">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#fffdfb; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#1f1915; -webkit-font-smoothing:antialiased; }
  a { color:#a72b00; text-decoration:underline; text-underline-offset:2px; }
  a:hover { color:#7e2000; }
  input::placeholder { color:#94897f; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;background:#fffdfb">
  <sc-if value="{{ showSidebar }}" hint-placeholder-val="{{ true }}">
    <div style="width:{{ sidebarWidth }};flex-shrink:0;border-right:1px solid #e2ddd9;background:#fff;display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh">
      <div style="display:flex;align-items:center;gap:10px;padding:0 16px 18px;border-bottom:1px solid #f0ebe7;margin-bottom:8px">
        <div style="width:26px;height:26px;border-radius:7px;background:#ca3c00;flex-shrink:0"></div>
        <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ true }}"><span style="font-size:14px;font-weight:800;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden">Jualin CRM</span></sc-if>
      </div>
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="9">
        <a href="{{ item.href }}" style="display:flex;align-items:center;gap:12px;padding:10px 16px;margin:1px 8px;border-radius:8px;cursor:pointer;color:{{ item.color }};background:{{ item.bg }};font-size:14px;font-weight:600;text-decoration:none" title="{{ item.label }}">
          <span style="width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ item.icon }}"></span>
          <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap;overflow:hidden;flex:1">{{ item.label }}</span></sc-if>
        </a>
      </sc-for>
      <div style="margin-top:auto;padding:12px 16px 0;border-top:1px solid #f0ebe7">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:30px;height:30px;border-radius:999px;background:#f5ede7;color:#a72b00;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">BS</div>
          <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ true }}">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Budi Santoso</div>
              <div style="font-size:11.5px;color:#6a635e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Toko Maju Jaya · Owner</div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:{{ bottomPad }}">
    <sc-if value="{{ showMobileHeader }}" hint-placeholder-val="{{ false }}">
      <div style="position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e2ddd9;padding:12px 16px;display:flex;align-items:center;gap:10px">
        <div style="width:24px;height:24px;border-radius:6px;background:#ca3c00"></div>
        <span style="font-size:15px;font-weight:800;flex:1">Pengaturan</span>
      </div>
    </sc-if>

    <div style="box-sizing:border-box;max-width:900px;width:100%;margin:0 auto;padding:{{ contentPad }};flex:1;display:flex;flex-direction:column;gap:{{ sectionGap }}">

      <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
        <h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-0.015em">Pengaturan</h1>
      </sc-if>

      <div style="display:flex;gap:8px;flex-wrap:wrap;overflow-x:{{ tabOverflow }}">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{ setTab }}" data-tab="{{ t.key }}" style="flex-shrink:0;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};white-space:nowrap">{{ t.label }}</button>
        </sc-for>
      </div>

      <!-- Bisnis -->
      <sc-if value="{{ tab === 'bisnis' }}" hint-placeholder-val="{{ true }}">
        <div style="border:1px solid #e2ddd9;border-radius:12px;background:#fff;padding:{{ cardPad }}">
          <h2 style="margin:0 0 16px;font-size:15px;font-weight:700">Profil bisnis</h2>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div><label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px">Nama bisnis</label><input value="{{ bizName }}" onChange="{{ onBizName }}" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #c9c3be" /></div>
            <div><label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px">Email bisnis</label><input value="{{ bizEmail }}" onChange="{{ onBizEmail }}" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #c9c3be" /></div>
            <div><label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px">Zona waktu</label>
              <select value="{{ tz }}" onChange="{{ onTz }}" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #c9c3be;background:#fff">
                <option value="wib">WIB — Jakarta</option><option value="wita">WITA — Makassar</option><option value="wit">WIT — Jayapura</option>
              </select>
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:18px">
            <button type="button" onClick="{{ saveBiz }}" style="cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;background:#ca3c00;color:#fff">Simpan</button>
          </div>
        </div>
      </sc-if>

      <!-- Notifikasi -->
      <sc-if value="{{ tab === 'notifikasi' }}" hint-placeholder-val="{{ false }}">
        <div style="border:1px solid #e2ddd9;border-radius:12px;background:#fff;padding:{{ cardPad }}">
          <h2 style="margin:0 0 16px;font-size:15px;font-weight:700">Notifikasi</h2>
          <div style="display:flex;flex-direction:column;gap:14px">
            <sc-for list="{{ notifPrefs }}" as="n" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #f7f3ef">
                <div><div style="font-size:14px;font-weight:600">{{ n.label }}</div><div style="font-size:12.5px;color:#6a635e;margin-top:2px">{{ n.desc }}</div></div>
                <button type="button" onClick="{{ toggleNotif }}" data-key="{{ n.key }}" style="flex-shrink:0;cursor:pointer;border:none;padding:0;width:44px;height:26px;border-radius:999px;background:{{ n.trackBg }};position:relative">
                  <span style="position:absolute;top:3px;left:{{ n.knobLeft }};width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s"></span>
                </button>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <!-- API -->
      <sc-if value="{{ tab === 'api' }}" hint-placeholder-val="{{ false }}">
        <div style="border:1px solid #e2ddd9;border-radius:12px;background:#fff;padding:{{ cardPad }}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap">
            <h2 style="margin:0;font-size:15px;font-weight:700">Kunci API</h2>
            <button type="button" onClick="{{ createKey }}" style="cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid #c9c3be;background:#fff;color:#1f1915">+ Buat kunci baru</button>
          </div>
          <sc-for list="{{ apiKeys }}" as="k" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #f7f3ef;flex-wrap:wrap">
              <div style="min-width:0">
                <div style="font-size:14px;font-weight:600">{{ k.label }}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#6a635e;margin-top:2px">{{ k.masked }}</div>
              </div>
              <button type="button" onClick="{{ revokeKey }}" data-id="{{ k.id }}" style="cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid #c0000f;background:#fff;color:#c0000f;flex-shrink:0">Cabut</button>
            </div>
          </sc-for>
          <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f0ebe7;font-size:13px;color:#6a635e">
            Endpoint webhook: <span style="font-family:'JetBrains Mono',monospace">https://api.jualin.id/v1/webhooks/lead</span>
          </div>
        </div>
      </sc-if>

      <!-- Keamanan -->
      <sc-if value="{{ tab === 'keamanan' }}" hint-placeholder-val="{{ false }}">
        <div style="border:1px solid #e2ddd9;border-radius:12px;background:#fff;padding:{{ cardPad }}">
          <h2 style="margin:0 0 16px;font-size:15px;font-weight:700">Kata sandi</h2>
          <div style="display:flex;flex-direction:column;gap:14px;max-width:340px">
            <div><label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px">Kata sandi saat ini</label><input type="password" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #c9c3be" /></div>
            <div><label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px">Kata sandi baru</label><input type="password" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #c9c3be" /></div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:18px">
            <button type="button" style="cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;background:#ca3c00;color:#fff">Ubah kata sandi</button>
          </div>
        </div>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2ddd9;display:grid;grid-template-columns:repeat(5,1fr);z-index:36">
      <sc-for list="{{ bottomNavItems }}" as="b" hint-placeholder-count="5">
        <a href="{{ b.href }}" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;color:{{ b.color }};font-size:11px;font-weight:600;text-decoration:none">
          <span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ b.icon }}"></span>
          {{ b.label }}
        </a>
      </sc-for>
    </div>
  </sc-if>
</div>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1915;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(31,25,21,.24);z-index:60">{{ toast }}</div>
</sc-if>
]]>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const NAV_ICONS = {
  home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>',
  lead: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  customer: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>',
  task: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  report: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  team: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M15.5 15c2.5.3 4.5 2 4.5 5"/></svg>',
  connect: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4M6 8h12l-1 6a5 5 0 01-10 0z"/><path d="M12 17v4"/></svg>',
  sub: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  settings: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5v.2a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H4a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V4a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1H20a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>'
};

class Component extends DCLogic {
  state = {
    vw: 1440, tab: 'bisnis', toast: '',
    bizName: 'Toko Maju Jaya', bizEmail: 'kontak@tokomajujaya.id', tz: 'wib',
    notifs: { lead_baru: true, tugas_jatuh_tempo: true, ringkasan_mingguan: false, lead_tanpa_pemilik: true },
    apiKeys: [{ id: 'k1', label: 'Formulir situs', masked: 'jln_live_8f2c••••••••a91' }, { id: 'k2', label: 'Integrasi webhook', masked: 'jln_live_2b7d••••••••c14' }]
  };
  componentDidMount() {
    this._onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    this.setState({ vw: window.innerWidth });
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }
  setTab = (e) => this.setState({ tab: e.currentTarget.dataset.tab });
  onBizName = (e) => this.setState({ bizName: e.target.value });
  onBizEmail = (e) => this.setState({ bizEmail: e.target.value });
  onTz = (e) => this.setState({ tz: e.target.value });
  saveBiz = () => { this.setState({ toast: 'Profil bisnis disimpan.' }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2200); };
  toggleNotif = (e) => { const key = e.currentTarget.dataset.key; this.setState(s => ({ notifs: { ...s.notifs, [key]: !s.notifs[key] } })); };
  createKey = () => {
    const id = 'k' + (this.state.apiKeys.length + 1);
    this.setState(s => ({ apiKeys: [...s.apiKeys, { id, label: 'Kunci baru', masked: 'jln_live_' + Math.random().toString(36).slice(2, 6) + '••••••••' + Math.random().toString(36).slice(2, 5) }] }));
  };
  revokeKey = (e) => { const id = e.currentTarget.dataset.id; this.setState(s => ({ apiKeys: s.apiKeys.filter(k => k.id !== id), toast: 'Kunci API dicabut.' })); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2200); };

  renderVals() {
    const vw = this.state.vw;
    const isMobile = vw < 768;
    const isTablet = vw >= 768 && vw < 1024;
    const tab = this.state.tab;

    const tabs = [['bisnis', 'Profil bisnis'], ['notifikasi', 'Notifikasi'], ['api', 'API & Webhook'], ['keamanan', 'Keamanan']].map(([key, label]) => ({
      key, label, border: tab === key ? '#ca3c00' : '#e2ddd9', bg: tab === key ? '#ca3c00' : '#fff', fg: tab === key ? '#fff' : '#4a443f'
    }));

    const notifMeta = [
      ['lead_baru', 'Lead baru masuk', 'Notifikasi setiap ada lead baru dari sumber manapun'],
      ['tugas_jatuh_tempo', 'Tugas jatuh tempo', 'Pengingat 1 hari sebelum tugas jatuh tempo'],
      ['ringkasan_mingguan', 'Ringkasan mingguan', 'Email ringkasan performa setiap Senin pagi'],
      ['lead_tanpa_pemilik', 'Lead tanpa pemilik aktif', 'Peringatan saat pemilik lead dinonaktifkan']
    ];
    const notifPrefs = notifMeta.map(([key, label, desc]) => {
      const on = this.state.notifs[key];
      return { key, label, desc, trackBg: on ? '#ca3c00' : '#e2ddd9', knobLeft: on ? '21px' : '3px' };
    });

    const navMeta = [
      ['home', 'Beranda', 'Beranda.dc.html'], ['lead', 'Lead', 'Daftar Lead.dc.html'], ['customer', 'Customer', 'Daftar Customer.dc.html'], ['task', 'Tugas', 'Tugas.dc.html'],
      ['report', 'Laporan', 'Laporan.dc.html'], ['team', 'Tim', 'Tim.dc.html'], ['connect', 'Connect', 'Connect.dc.html'], ['sub', 'Langganan', 'Langganan.dc.html'], ['settings', 'Pengaturan', 'Pengaturan.dc.html']
    ];
    const navItems = navMeta.map(([icon, label, href]) => ({
      icon: { __html: NAV_ICONS[icon] }, label, href, color: label === 'Pengaturan' ? '#a72b00' : '#1f1915', bg: label === 'Pengaturan' ? '#fff1e0' : 'transparent'
    }));
    const bottomNavItems = [
      { icon: { __html: NAV_ICONS.home }, label: 'Beranda', color: '#6a635e', href: 'Beranda.dc.html' },
      { icon: { __html: NAV_ICONS.lead }, label: 'Lead', color: '#6a635e', href: 'Daftar Lead.dc.html' },
      { icon: { __html: NAV_ICONS.task }, label: 'Tugas', color: '#6a635e', href: 'Tugas.dc.html' },
      { icon: { __html: NAV_ICONS.report }, label: 'Laporan', color: '#6a635e', href: 'Laporan.dc.html' },
      { icon: { __html: NAV_ICONS.settings }, label: 'Atur', color: '#a72b00', href: 'Pengaturan.dc.html' }
    ];

    return {
      isMobile, isTablet, tab,
      showSidebar: !isMobile, sidebarExpanded: !isMobile && !isTablet, sidebarWidth: (!isMobile && !isTablet) ? '232px' : '68px',
      showMobileHeader: isMobile, bottomPad: isMobile ? '76px' : '0',
      contentPad: isMobile ? '14px' : isTablet ? '20px' : '28px', sectionGap: isMobile ? '14px' : '18px', cardPad: isMobile ? '16px' : '20px',
      tabOverflow: isMobile ? 'auto' : 'visible',
      navItems, bottomNavItems, tabs, setTab: this.setTab,
      bizName: this.state.bizName, onBizName: this.onBizName, bizEmail: this.state.bizEmail, onBizEmail: this.onBizEmail,
      tz: this.state.tz, onTz: this.onTz, saveBiz: this.saveBiz,
      notifPrefs, toggleNotif: this.toggleNotif,
      apiKeys: this.state.apiKeys, createKey: this.createKey, revokeKey: this.revokeKey,
      toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
