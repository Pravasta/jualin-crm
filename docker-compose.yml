services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jualin
      POSTGRES_PASSWORD: jualin
      POSTGRES_DB: jualin_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jualin -d jualin_crm"]
      interval: 2s
      timeout: 3s
      retries: 15

  # SMTP + web UI for local email — no real provider needed to develop
  # against (issue #64). api does NOT depend_on this: SMTP is only
  # touched when an email is actually sent, never at boot, so a
  # slow/unhealthy mailpit must never block `docker compose up` from
  # serving traffic (same reasoning as api having no depends_on for
  # anything beyond postgres's own readiness).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI — http://localhost:8025

  api:
    build:
      context: ./crm_be
    # Defaults match .env.example so `docker compose up` works on a fresh
    # clone with zero setup. Override any of these with a local .env file
    # if needed — env_file is intentionally NOT used here so a missing
    # .env never breaks `docker compose up`.
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://jualin:jualin@postgres:5432/jualin_crm?sslmode=disable
      DB_MAX_CONNS: 10
      LOG_LEVEL: debug
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # api is exposed straight to the host here — no reverse proxy in
      # front of it, so X-Forwarded-For/X-Real-IP must never be trusted
      # (issue #57).
      TRUSTED_PROXIES: none
      # Dev-only placeholder — never reused in a real environment. Required
      # (no default) so a missing secret fails boot loudly instead of
      # silently invalidating tokens on restart (Rule #36).
      JWT_SECRET: development-only-secret-do-not-use-in-production
      # Real SMTP send, to the mailpit service above — not LogMailer
      # (issue #63, #64). "mailpit" resolves via Docker's default compose
      # network; SMTP_TLS=none because Mailpit takes no TLS locally
      # (config.Validate rejects "none" outright when APP_ENV=production).
      MAIL_PROVIDER: smtp
      MAIL_FROM: no-reply@jualin.local
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: none
      # "none" (no-op, logged only) — same "works on a fresh clone with
      # zero setup" reasoning as the rest of this block. A real service
      # account JSON has nowhere safe to live in this file (issue #68/
      # #73, td.md §14); switching to `fcm` is a local .env override,
      # never a docker-compose.yml default.
      PUSH_PROVIDER: none
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
