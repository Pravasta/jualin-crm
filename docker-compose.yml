services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jualin
      POSTGRES_PASSWORD: jualin
      POSTGRES_DB: jualin_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jualin -d jualin_crm"]
      interval: 2s
      timeout: 3s
      retries: 15

  # SMTP + web UI for local email — no real provider needed to develop
  # against (issue #64). api does NOT depend_on this: SMTP is only
  # touched when an email is actually sent, never at boot, so a
  # slow/unhealthy mailpit must never block `docker compose up` from
  # serving traffic (same reasoning as api having no depends_on for
  # anything beyond postgres's own readiness).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI — http://localhost:8025

  api:
    build:
      context: ./crm_be
    # Defaults match .env.example so `docker compose up` works on a fresh
    # clone with zero setup. Override any of these with a local .env file
    # if needed — env_file is intentionally NOT used here so a missing
    # .env never breaks `docker compose up`.
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://jualin:jualin@postgres:5432/jualin_crm?sslmode=disable
      DB_MAX_CONNS: 10
      LOG_LEVEL: debug
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # api is exposed straight to the host here — no reverse proxy in
      # front of it, so X-Forwarded-For/X-Real-IP must never be trusted
      # (issue #57).
      TRUSTED_PROXIES: none
      # Dev-only placeholder — never reused in a real environment. Required
      # (no default) so a missing secret fails boot loudly instead of
      # silently invalidating tokens on restart (Rule #36).
      JWT_SECRET: development-only-secret-do-not-use-in-production
      # Real SMTP send, to the mailpit service above — not LogMailer
      # (issue #63, #64). "mailpit" resolves via Docker's default compose
      # network; SMTP_TLS=none because Mailpit takes no TLS locally
      # (config.Validate rejects "none" outright when APP_ENV=production).
      MAIL_PROVIDER: smtp
      MAIL_FROM: no-reply@jualin.local
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: none
      # "none" (no-op, logged only) — same "works on a fresh clone with
      # zero setup" reasoning as the rest of this block. A real service
      # account JSON has nowhere safe to live in this file (issue #68/
      # #73, td.md §14); switching to `fcm` is a local .env override,
      # never a docker-compose.yml default.
      PUSH_PROVIDER: none
      # Dev-only placeholder — same reasoning as JWT_SECRET above.
      # Required (no default), so a missing secret fails boot loudly
      # instead of silently invalidating every embed page's in-flight
      # time-trap token (issue #87).
      FORM_TOKEN_SECRET: development-only-form-token-secret-do-not-use-in-production
      # "none" (always passes) — same "works on a fresh clone with zero
      # setup" reasoning as PUSH_PROVIDER above. Real Turnstile keys have
      # nowhere safe to live in this file; switching to `turnstile` is a
      # local .env override, never a docker-compose.yml default.
      CAPTCHA_PROVIDER: none
      # Relax the outbound-webhook SSRF guard so a local receiver
      # (http://localhost:PORT, http://host.docker.internal:PORT) can be
      # registered for development and manual testing (issue #100, td.md
      # §3.4). Rejected outright when APP_ENV=production — a production
      # process that will POST lead data to a private address is a hole,
      # not a degraded mode.
      WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"
      # Dev-only placeholder — same reasoning as JWT_SECRET and
      # FORM_TOKEN_SECRET above. Required (no default) so a missing key
      # fails boot loudly instead of letting endpoint creation fail one
      # request at a time. Unlike those two this key is REVERSIBLE by
      # design (migration 0009): the worker needs the original signing
      # secret back to compute the HMAC proving a request came from us.
      WEBHOOK_SECRET_ENC_KEY: development-only-webhook-enc-key-do-not-use-in-production
      # The delivery worker runs here so `docker compose up` exercises the
      # whole path, not just enqueueing (issue #102). Defaults match
      # .env.example; a shorter interval than production would be a local
      # .env override, never a default here.
      WEBHOOK_WORKER_ENABLED: "true"
      WEBHOOK_WORKER_INTERVAL: 10s
      WEBHOOK_WORKER_BATCH: 20
      WEBHOOK_DELIVERY_TIMEOUT: 10s
      WEBHOOK_MAX_ATTEMPTS: 5
      WEBHOOK_DELIVERY_RETENTION_DAYS: 30
      # --- Paket berbayar & kuota (Phase 8.5, issue #122-#126) ---
      # Dev-only placeholder - same shape and same reasoning as JWT_SECRET,
      # FORM_TOKEN_SECRET, and WEBHOOK_SECRET_ENC_KEY above: a literal here
      # so `docker compose up` exercises the whole path with zero setup,
      # never reused in a real environment. Empty would mean
      # POST /internal/subscriptions/{id}/plan is not registered at all
      # (a 404), which would make docs/testing/flow/09-webhook.md 9.11
      # impossible to run out of the box.
      SUBSCRIPTION_ADMIN_TOKEN: ${SUBSCRIPTION_ADMIN_TOKEN:-development-only-subscription-admin-token-do-not-use-in-production}
      # Enables POST /v1/subscription/test-checkout so the "Coba Pro (test)"
      # button on the Langganan screen works locally. Safe to default true
      # HERE and only here: config.Validate REJECTS this outright when
      # APP_ENV=production (a customer upgrading themselves for free is a
      # hole, not a degraded mode), so it cannot follow this file into a
      # real deployment unnoticed.
      SUBSCRIPTION_TEST_CHECKOUT: ${SUBSCRIPTION_TEST_CHECKOUT:-true}
      # The ONE value in this block read from a local .env instead of being
      # written here, and deliberately so: it is a real contact address,
      # not a dev placeholder, and today's value is a personal number that
      # must not enter git history (issue #125 follow-up). Compose
      # substitutes it from ./.env (gitignored); `:-` keeps a missing .env
      # from breaking `docker compose up`, exactly as the comment at the
      # top of this block promises. Empty means the Enterprise card renders
      # with no link - never a dead button.
      ENTERPRISE_CONTACT_URL: ${ENTERPRISE_CONTACT_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
